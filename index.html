<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>PKBM Kuntum Mekar - Pengumuman Kelulusan</title>

<style>
/* ================= RESET & GLOBAL ================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #020617 100%);
    color: white;
    overflow-x: hidden;
    position: relative;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Blur background orbs */
.bg-circle {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.2;
    z-index: 0;
    pointer-events: none;
}
.circle1 {
    width: 350px;
    height: 350px;
    background: #38bdf8;
    top: -100px;
    left: -80px;
}
.circle2 {
    width: 500px;
    height: 500px;
    background: #a855f7;
    bottom: -150px;
    right: -100px;
}
.circle3 {
    width: 400px;
    height: 400px;
    background: #0ea5e9;
    top: 40%;
    left: 60%;
}

/* ================= WELCOME SCREEN ================= */
#welcomeScreen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #0f172a, #020617);
    z-index: 10000;
    backdrop-filter: blur(4px);
}
.welcome-text {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: 8px;
    background: linear-gradient(135deg, #7dd3fc, #38bdf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    transform: scale(0.85);
    animation: fadeInScale 1.4s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards, glowPulse 1.8s infinite alternate;
}
@keyframes fadeInScale {
    to {
        opacity: 1;
        transform: scale(1);
    }
}
@keyframes glowPulse {
    from { text-shadow: 0 0 5px #38bdf8; }
    to { text-shadow: 0 0 30px #38bdf8, 0 0 45px #0ea5e9; }
}
.fade-out {
    animation: fadeOutAnim 0.9s forwards;
}
@keyframes fadeOutAnim {
    to {
        opacity: 0;
        transform: scale(1.2);
        visibility: hidden;
    }
}

/* ================= MAIN CONTENT ================= */
#mainContent {
    opacity: 0;
    transition: opacity 0.9s ease;
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 550px;
    margin: 0 auto;
}
#mainContent.show {
    opacity: 1;
}
.hidden {
    display: none;
}

/* ================= GLASS CARD (TENGAH VERTIKAL) ================= */
.glass-card {
    backdrop-filter: blur(18px);
    background: rgba(15, 25, 45, 0.65);
    border-radius: 2.5rem;
    border: 1px solid rgba(56, 189, 248, 0.3);
    box-shadow: 0 25px 45px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.08);
    padding: 2rem 1.8rem;
    transition: all 0.2s;
}

/* Container utama untuk membuat glass-card di tengah vertikal */
.main-container {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
}

.search-area {
    text-align: center;
}
.search-area h2 {
    font-size: 1.9rem;
    font-weight: 700;
    background: linear-gradient(135deg, #e0f2fe, #7dd3fc);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 0.5rem;
}
.subtitle {
    color: #94a3b8;
    margin-bottom: 2rem;
    font-size: 0.9rem;
}
.input-group {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}
.input-field {
    background: rgba(255,255,255,0.07);
    border: 1px solid #334155;
    border-radius: 2rem;
    padding: 1rem 1.5rem;
    color: white;
    font-size: 1rem;
    outline: none;
    transition: 0.2s;
}
.input-field:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 12px rgba(56,189,248,0.4);
    background: rgba(255,255,255,0.12);
}
.btn-primary {
    background: linear-gradient(100deg, #0ea5e9, #3b82f6);
    border: none;
    border-radius: 3rem;
    padding: 1rem;
    font-weight: bold;
    font-size: 1.1rem;
    cursor: pointer;
    color: white;
    transition: 0.2s;
    margin-top: 0.5rem;
    box-shadow: 0 5px 12px rgba(14,165,233,0.3);
}
.btn-primary:hover {
    transform: scale(1.02);
    box-shadow: 0 0 20px #38bdf8;
}

/* ================= LOADING OVERLAY ================= */
.loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px);
    z-index: 30000;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    animation: fadeInModal 0.3s ease;
}
.loading-spinner-large {
    width: 60px;
    height: 60px;
    border: 4px solid rgba(56, 189, 248, 0.2);
    border-top: 4px solid #38bdf8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
.loading-text {
    color: #38bdf8;
    font-size: 1.2rem;
    font-weight: 500;
    letter-spacing: 1px;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}
@keyframes fadeInModal {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* ================= MODAL ================= */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20000;
    padding: 20px;
    animation: fadeModal 0.3s ease;
}
@keyframes fadeModal {
    from { opacity: 0; }
    to { opacity: 1; }
}
.success-card {
    max-width: 500px;
    width: 100%;
    background: linear-gradient(145deg, #0f172a, #030617);
    border-radius: 2rem;
    border: 1px solid rgba(56,189,248,0.6);
    padding: 2rem 1.8rem;
    box-shadow: 0 30px 50px rgba(0,0,0,0.5);
    text-align: center;
    animation: slideUp 0.4s;
}
@keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}
.lulus-badge {
    font-size: 2.5rem;
    font-weight: 800;
    color: #facc15;
    text-shadow: 0 0 6px #fbbf24;
    letter-spacing: 2px;
    margin-bottom: 1rem;
}

/* DATA CENTER - Tanpa label, hanya value dengan ukuran berbeda */
.data-center {
    margin: 1.5rem 0;
    text-align: center;
}
.data-nama {
    font-size: 1.8rem;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 0.5rem;
    word-break: break-word;
}
.data-nisn {
    font-size: 1.1rem;
    color: #cbd5e1;
    margin-bottom: 0.5rem;
    letter-spacing: 1px;
}
.data-ttl {
    font-size: 0.95rem;
    color: #94a3b8;
    margin-top: 0.3rem;
}

.ketua {
    margin-top: 1.5rem;
    border-top: 1px dashed #334155;
    padding-top: 1rem;
    font-style: italic;
    font-size: 0.85rem;
    color: #a5f3fc;
}

/* Footer link kecil untuk Buat Pas Foto */
.pasfoto-footer {
    margin-top: 1.2rem;
    text-align: center;
}
.pasfoto-link {
    font-size: 0.75rem;
    color: #2dd4bf;
    text-decoration: none;
    cursor: pointer;
    transition: 0.2s;
    display: inline-block;
    opacity: 0.8;
}
.pasfoto-link:hover {
    opacity: 1;
    text-decoration: underline;
}

/* Tombol tutup full width */
.btn-close-full {
    background: #475569;
    border: none;
    border-radius: 3rem;
    padding: 0.9rem 1rem;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    color: white;
    transition: 0.2s;
    width: 100%;
    margin-top: 1rem;
}
.btn-close-full:hover {
    background: #334155;
    transform: scale(1.01);
}

.modal-confirm {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 21000;
    padding: 1rem;
}
.confirm-inner {
    background: #111827;
    max-width: 400px;
    border-radius: 2rem;
    padding: 2rem;
    text-align: center;
    border: 1px solid #38bdf8;
}
.confirm-btns {
    display: flex;
    gap: 16px;
    margin-top: 28px;
}
.confirm-btns button {
    flex: 1;
    padding: 10px;
    border-radius: 50px;
    border: none;
    font-weight: bold;
    cursor: pointer;
}
.btn-yes {
    background: #0ea5e9;
    color: white;
}
.btn-no {
    background: #334155;
    color: white;
}

@media (max-width: 550px) {
    .welcome-text { font-size: 42px; letter-spacing: 4px; }
    .glass-card { padding: 1.5rem; }
    .data-nama { font-size: 1.5rem; }
    .data-nisn { font-size: 1rem; }
}
</style>
</head>
<body>

<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>
<div class="bg-circle circle3"></div>

<div id="welcomeScreen">
    <h1 class="welcome-text">WELCOME</h1>
</div>

<div id="mainContent" class="hidden">
    <div class="main-container">
        <div class="glass-card">
            <div class="search-area">
                <h2>PENGUMUMAN KELULUSAN</h2>

<script>
// ========== KONFIGURASI ==========
// GANTI DENGAN URL WEB APP APPS SCRIPT ANDA!
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzTj_S0eOx1xgQErWxNgeM1YEaBNjqM6RZwtE9ruiYE5wB-2Cdk5cYJkf74ki00Xhfqdw/exec';

let currentStudentData = null;

async function searchStudentByNISN(nisn) {
    try {
        const response = await fetch(`${APPS_SCRIPT_URL}?nisn=${encodeURIComponent(nisn)}`);
        const data = await response.json();
        
        if (data.success && data.nama) {
            return data;
        } else {
            return null;
        }
    } catch (err) {
        console.error('Error fetching data:', err);
        return null;
    }
}

function removeExistingModals() {
    document.querySelectorAll('.modal-overlay, .modal-confirm, .loading-overlay').forEach(el => el.remove());
}

// Fungsi loading dengan efek gelap di tengah screen
function showLoadingSpinner() {
    removeExistingModals();
    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'loading-overlay';
    loadingDiv.innerHTML = `
        <div class="loading-spinner-large"></div>
        <div class="loading-text">Memeriksa data...</div>
    `;
    document.body.appendChild(loadingDiv);
    return loadingDiv;
}

function hideLoadingSpinner(loadingElement) {
    if (loadingElement && loadingElement.remove) {
        loadingElement.remove();
    }
}

function showGraduationCard(student) {
    removeExistingModals();
    
const tanggalFormatted = formatTanggal(student.tanggalLahir);
const tempatTanggal = `${student.tempatLahir || '-'}, ${tanggalFormatted}`;
    const isLulus = (student.status || "").toLowerCase() === "lulus";
    
    if (!isLulus) {

                <div style="font-size:1.4rem; margin:10px 0;">Anda dinyatakan</div>

    modalDiv.innerHTML = `
        <div class="success-card">

            </div>
            
            <div class="ketua">
                Ketua PKBM Kuntum Mekar<br>Kecamatan Tapa<br><b>Ritha Gani, S.Pd, M.Pd</b>
            </div>
            
            <button class="btn-close-full" id="closeModalFinalBtn">Tutup</button>

            <div class="pasfoto-footer">

            </div>

    `;
    document.body.appendChild(modalDiv);
    
    modalDiv.querySelector('#closeModalFinalBtn').addEventListener('click', () => {

}

function formatTanggal(tanggalInput) {
    if (!tanggalInput) return '-';
    
    // Jika tanggal sudah dalam format dd/mm/yyyy
    if (typeof tanggalInput === 'string' && tanggalInput.includes('/')) {
        return tanggalInput; // langsung return jika sudah format yang benar
    }
    
    // Jika tanggal berupa object Date atau string yang dikonversi JS
    try {
        let dateObj = new Date(tanggalInput);
        // Cek apakah valid
        if (!isNaN(dateObj.getTime())) {
            // Konversi ke format dd/mm/yyyy
            const day = String(dateObj.getDate()).padStart(2, '0');
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const year = dateObj.getFullYear();
            return `${day}/${month}/${year}`;
        }
    } catch(e) {
        return tanggalInput;
    }
    
    return tanggalInput;
}

function showPhotoConfirmation(student) {
    removeExistingModals();
    const confirmModal = document.createElement('div');
    confirmModal.className = 'modal-confirm';
    confirmModal.innerHTML = `
        <div class="confirm-inner">
            <h3 style="color:#38bdf8; margin-bottom:16px;">📸 Konfirmasi Pas Foto</h3>
            <p style="margin-bottom:12px;">Pas Foto digunakan untuk keperluan dokumen seperti ijazah. Apakah Anda akan lanjut untuk membuat pasfoto ?</p>
            <div class="confirm-btns">
                <button id="confirmNo" class="btn-no">Tidak</button>
                <button id="confirmYes" class="btn-yes">Ya, Lanjutkan</button>
            </div>
        </div>
    `;
    document.body.appendChild(confirmModal);
    
    confirmModal.querySelector('#confirmNo').addEventListener('click', () => {
        confirmModal.remove();
        window.location.reload();
    });
    
    confirmModal.querySelector('#confirmYes').addEventListener('click', () => {
        confirmModal.remove();
        const slugName = student.nama.toLowerCase().replace(/\s+/g, '-').replace(/[^\w\-]/g, '');
        sessionStorage.setItem("photoSessionData", JSON.stringify({ 
            nama: student.nama, 
            nisn: student.nisn,
            tempatLahir: student.tempatLahir,
            tanggalLahir: student.tanggalLahir
        }));
        window.open(`${window.location.origin}${window.location.pathname}?page=photo&id=${encodeURIComponent(slugName)}`, '_blank');
    });
}

function renderPhotoStudioPage(studentData) {

        <div class="bg-circle circle2"></div>

                </div>

            </div>
        </div>
    `;
    
    document.getElementById('studioNama').value = studentData.nama;
    document.getElementById('studioNisn').value = studentData.nisn;
    
    let currentImageBlob = null;
    const previewImg = document.getElementById('imagePreview');

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function handlePhotoPageRouting() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('page') === 'photo') {
        const sessionData = sessionStorage.getItem("photoSessionData");
        if (sessionData) {
            const student = JSON.parse(sessionData);
            sessionStorage.removeItem("photoSessionData");
            renderPhotoStudioPage(student);
        } else {
            renderPhotoStudioPage({ nama: "Peserta", nisn: "----" });
        }
        return true;
    }
    return false;
}

document.addEventListener('DOMContentLoaded', () => {
    if (handlePhotoPageRouting()) return;
    
    const welcome = document.getElementById('welcomeScreen');
    const main = document.getElementById('mainContent');
    
    setTimeout(() => {
        welcome.classList.add('fade-out');
        setTimeout(() => {
            welcome.style.display = 'none';
            main.classList.remove('hidden');
            setTimeout(() => main.classList.add('show'), 80);
        }, 800);
    }, 2500);
    
    const searchBtn = document.getElementById('searchBtn');
    const nisnInput = document.getElementById('nisnInput');
    const infoMsg = document.getElementById('infoMessage');
    
    async function performSearch() {
        const nisnVal = nisnInput.value.trim();
        if (!nisnVal) {
            infoMsg.innerText = "⚠️ Masukkan NISN terlebih dahulu.";
            return;
        }
        
        // Tampilkan loading spinner dengan efek gelap di tengah
        const loadingOverlay = showLoadingSpinner();
        
        const student = await searchStudentByNISN(nisnVal);
        
        hideLoadingSpinner(loadingOverlay);
        
        if (!student) {
            infoMsg.innerHTML = "❌ NISN tidak ditemukan. Pastikan terdaftar di PKBM Kuntum Mekar.";
            return;
        }
        infoMsg.innerHTML = "";
        currentStudentData = student;
        
        // Animasi transisi kilat (efek gemerlap) seperti style awal
        const animOverlay = document.createElement('div');
        animOverlay.style.cssText = 'position:fixed; inset:0; background:radial-gradient(circle, #020617, black); z-index:30000; display:flex; align-items:center; justify-content:center;';
        animOverlay.innerHTML = '<h1 style="font-size:48px; color:#38bdf8; animation:fadeInScale 0.8s;">✨</h1>';
        document.body.appendChild(animOverlay);
        setTimeout(() => {
            animOverlay.remove();
            showGraduationCard(student);
        }, 850);
    }
    
    searchBtn.addEventListener('click', performSearch);
    nisnInput.addEventListener('keypress', (e) => {
        if(e.key === 'Enter') performSearch();
    });
});
</script>
</body>
</html>
